name: test-generateur-icones
on:
  push:
    paths: ["generateur-icones/**", ".github/workflows/test-generateur-icones.yml"]
  pull_request:
    paths: ["generateur-icones/**"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 generateur-icones/tests/smoke.py
