name: Synchroniser gh-pages sur main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-gh-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aligner gh-pages sur main
        run: git push --force origin HEAD:refs/heads/gh-pages

      # Un push fait avec GITHUB_TOKEN ne lance pas la publication : on la demande.
      - name: Demander la publication GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
