name: test-fusion-pdf
on:
  push:
    paths: ["fusion-pdf/**", ".github/workflows/test-fusion-pdf.yml"]
  pull_request:
    paths: ["fusion-pdf/**"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright reportlab pypdf && playwright install --with-deps chromium
      - run: python3 fusion-pdf/tests/make_pdfs.py && python3 fusion-pdf/tests/smoke.py
        working-directory: .
